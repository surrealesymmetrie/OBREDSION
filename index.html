<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>OBREDSION – Index</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Almendra+Display&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Cinzel Decorative', serif;
      background: url('kiss.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      text-align: center;
    }
    .player-box {
      background: rgba(0,0,0,0.6); /* halbtransparentes Schwarz */
      border-radius: 20px;          /* abgerundete Ecken */
      padding: 40px;
      max-width: 500px;
      margin: 15% auto;             /* zentriert vertikal/horizontal */
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
    }
    h1 {
      font-size: 3em;
      margin: 0;
    }
    h1 .red {
      color: red;
    }
    h2 {
      font-family: 'Almendra Display', serif;
      color: red;
      margin-top: -10px;
    }
    .cover {
      margin: 20px auto;
      width: 200px;
      height: 200px;
      background: url('squarecover.png') no-repeat center center;
      background-size: cover;
      border-radius: 10px;
    }
    .start a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background: red;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-family: 'Almendra Display', serif;
      font-size: 1.2em;
      transition: background 0.3s;
    }
    .start a:hover {
      background: darkred;
    }
  </style>
</head>
<body>
  <div class="player-box">
    <h1>OB<span class="red">RED</span>SION</h1>
    <h2>im Finden verloren</h2>

    <div class="cover"></div>

    <div class="start">
      <a href="red01.html">Start</a>
    </div>
  </div>
</body>
</html>

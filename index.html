<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>OBREDSION – im Finden verloren</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Almendra+Display&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Cinzel Decorative', serif;
      background: url('kiss.jpg') no-repeat center center fixed;
      background-size: cover;
      color: black;
      text-align: center;
    }
    h1 {
      font-size: 3em;
    }
    h1 .red {
      color: red;
    }
    h2 {
      font-family: 'Almendra Display', serif;
      color: red;
      margin-top: -10px;
    }
    .cover {
      margin: 20px auto;
      width: 300px;
      height: 300px;
      background: url('squarecover.png') no-repeat center center;
      background-size: cover;
    }
    h3 {
      margin-top: 30px;
      font-size: 1.5em;
    }
    #player {
      width: 80%;
      margin: 20px auto;
      display: block;
    }
    ul.playlist {
      list-style: none;
      padding: 0;
      margin: 20px auto;
      width: 60%;
      text-align: left;
    }
    ul.playlist li {
      padding: 8px;
      cursor: pointer;
      border-bottom: 1px solid #ccc;
    }
    ul.playlist li.active {
      background: rgba(255,0,0,0.2);
      font-weight: bold;
    }
    .next {
      margin: 30px;
    }
    .next a {
      text-decoration: none;
      background: red;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      font-family: 'Almendra Display', serif;
    }
  </style>
</head>
<body>
  <h1>OB<span class="red">RED</span>SION</h1>
  <h2>im Finden verloren</h2>

  <div class="cover"></div>

  <h3>Kapitel I – mein Leid</h3>

  <!-- EINZIGER PLAYER -->
  <audio id="player" controls preload="auto"></audio>

  <!-- PLAYLIST -->
  <ul class="playlist" id="playlist">
    <li data-src="red01-1.mp3">PRUDENCE</li>
    <li data-src="red01-2.mp3">PHILINE</li>
    <li data-src="red01-3.mp3">RYNN</li>
  </ul>

  <div class="next">
    <a href="red02.html">Kapitel II</a>
  </div>

  <script>
    const player = document.getElementById('player');
    const playlist = document.getElementById('playlist');
    const tracks = playlist.getElementsByTagName('li');
    let current = 0;

    // Funktion: Track laden
    function loadTrack(index) {
      for (let i = 0; i < tracks.length; i++) {
        tracks[i].classList.remove('active');
      }
      tracks[index].classList.add('active');
      player.src = tracks[index].getAttribute('data-src');
      player.load();

      // gespeicherte Position laden
      const saved = localStorage.getItem('chapter1-track' + index);
      if (saved) player.currentTime = saved;
    }

    // Track starten
    function playTrack(index) {
      loadTrack(index);
      player.play();
    }

    // Playlist-Klick
    for (let i = 0; i < tracks.length; i++) {
      tracks[i].addEventListener('click', () => {
        current = i;
        playTrack(current);
      });
    }

    // Nächster Track nach Ende
    player.addEventListener('ended', () => {
      current++;
      if (current >= tracks.length) current = 0;
      playTrack(current);
    });

    // Fortschritt speichern
    player.addEventListener('timeupdate', () => {
      localStorage.setItem('chapter1-track' + current, player.currentTime);
    });

    // Ersten Track laden
    loadTrack(current);
  </script>
</body>
</html>

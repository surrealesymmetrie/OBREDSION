<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>OBREDSION – Kapitel IV</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Almendra+Display&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Cinzel Decorative', serif;
      background: url('kiss.jpg') no-repeat center center fixed;
      background-size: cover;
      color: black;
      text-align: center;
    }
    h1 {
      font-size: 3em;
    }
    h1 .red {
      color: red;
    }
    h2 {
      font-family: 'Almendra Display', serif;
      color: red;
      margin-top: -10px;
    }
    .cover {
      margin: 20px auto;
      width: 300px;
      height: 300px;
      background: url('squarecover.png') no-repeat center center;
      background-size: cover;
    }
    h3 {
      margin-top: 30px;
      font-size: 1.5em;
    }
    audio {
      width: 80%;
      margin: 10px auto;
      display: block;
    }
    .next {
      margin: 30px;
    }
    .next a {
      text-decoration: none;
      background: red;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      font-family: 'Almendra Display', serif;
    }
  </style>
</head>
<body>
  <h1>OB<span class="red">RED</span>SION</h1>
  <h2>im Finden verloren</h2>

  <div class="cover"></div>

  <h3>Kapitel IV – mein Leid</h3>

  <audio id="track1" controls preload="auto">
    <source src="red04-1.mp3" type="audio/mpeg">
    PHILINE
  </audio>
  <audio id="track2" controls preload="auto">
    <source src="red04-2.mp3" type="audio/mpeg">
    PRUDENCE
  </audio>
  <audio id="track3" controls preload="auto">
    <source src="red04-3.mp3" type="audio/mpeg">
    RYNN
  </audio>

  <div class="next">
    <a href="red05.html">Kapitel V</a>
  </div>

  <script>
    // Automatisch zum nächsten Track springen
    const tracks = [
      document.getElementById('track1'),
      document.getElementById('track2'),
      document.getElementById('track3')
    ];
    tracks.forEach((track, i) => {
      track.addEventListener('ended', () => {
        if (i + 1 < tracks.length) {
          tracks[i+1].play();
        }
      });
    });

    // Fortschritt speichern & laden
    tracks.forEach((track, i) => {
      const key = 'chapter4-track' + i;
      track.addEventListener('timeupdate', () => {
        localStorage.setItem(key, track.currentTime);
      });
      track.addEventListener('loadedmetadata', () => {
        const saved = localStorage.getItem(key);
        if (saved) track.currentTime = saved;
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>OBREDSION – Kapitel II</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Almendra+Display&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: url('kiss.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Calisto MT', serif;
      color: white;
      text-align: center;
    }
    .player-box {
      background: rgba(0,0,0,0.6);
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      margin: 8% auto;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
    }
    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 3em;
      margin: 0;
      color: white;
    }
    h1 .red {
      color: red;
    }
    h2 {
      font-family: 'Almendra Display', serif;
      color: white;
      margin-top: -10px;
    }
    .cover {
      margin: 20px auto;
      width: 250px;
      height: 250px;
      background: url('squarecover.png') no-repeat center center;
      background-size: cover;
      border-radius: 10px;
    }
    h3 {
      margin-top: 30px;
      font-size: 1.5em;
    }
    #player {
      width: 100%;
      margin: 20px auto;
      display: block;
    }
    ul.playlist {
      list-style: none;
      padding: 0;
      margin: 20px auto;
      width: 80%;
      text-align: left;
    }
    ul.playlist li {
      padding: 8px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.3);
    }
    ul.playlist li.active {
      background: rgba(255,0,0,0.3);
      font-weight: bold;
    }
    .next {
      margin-top: 30px;
    }
    .next a {
      text-decoration: none;
      background: red;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-family: 'Almendra Display', serif;
      font-size: 1.2em;
      transition: background 0.3s;
    }
    .next a:hover {
      background: darkred;
    }
  </style>
</head>
<body>
  <div class="player-box">
    <h1>OB<span class="red">RED</span>SION</h1>
    <h2>im Gefundenwerden verloren</h2>

    <div class="cover"></div>

    <h3>Kapitel II – der schlimmste Albtraum meines Lebens</h3>

    <!-- EINZIGER PLAYER -->
    <audio id="player" controls preload="auto"></audio>

    <!-- PLAYLIST -->
    <ul class="playlist" id="playlist">
      <li data-src="red02-1.mp3">PRUDENCE</li>
      <li data-src="red02-2.mp3">PHILINE</li>
      <li data-src="red02-3.mp3">CALLIOPE</li>
      <li data-src="red02-4.mp3">RYNN</li>
    </ul>

    <!-- Button zu Kapitel III -->
    <div class="next">
      <a href="red03.html">Kapitel III</a>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const playlist = document.getElementById('playlist');
    const tracks = playlist.getElementsByTagName('li');
    let current = 0;

    function loadTrack(index) {
      for (let i = 0; i < tracks.length; i++) {
        tracks[i].classList.remove('active');
      }
      tracks[index].classList.add('active');
      player.src = tracks[index].getAttribute('data-src');
      player.load();

      // gespeicherte Position laden
      const saved = localStorage.getItem('chapter2-track' + index);
      if (saved) player.currentTime = saved;
    }

    function playTrack(index) {
      loadTrack(index);
      player.play();
    }

    for (let i = 0; i < tracks.length; i++) {
      tracks[i].addEventListener('click', () => {
        current = i;
        playTrack(current);
      });
    }

    player.addEventListener('ended', () => {
      current++;
      if (current >= tracks.length) current = 0;
      playTrack(current);
    });

    player.addEventListener('timeupdate', () => {
      localStorage.setItem('chapter2-track' + current, player.currentTime);
    });

    // Ersten Track laden
    loadTrack(current);
  </script>
</body>
</html>
